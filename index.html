    <div style="max-width: 40rem; margin: 3rem auto; padding: 0 1rem; color: #d8e0da; font-family: system-ui, sans-serif; line-height: 1.5">
      <h1>GHOSTFX: a free guitar effects pedal in your browser</h1>
      <p>Plug your guitar into an audio interface and play through six amp and pedal rigs in real time, with nothing to install.</p>
      <ul>
        <li>Six rigs, each its own chain of drive, delay, modulation, cabinet and reverb</li>
        <li>A 3D pedal whose knobs you actually turn</li>
        <li>Tuner, metronome and a keyboard synth</li>
        <li>Record takes, re-amp them through any rig and export to MP3</li>
        <li>Free and open source under GPL-3.0</li>
      </ul>
      <p>GHOSTFX runs on JavaScript and the Web Audio API. Turn JavaScript on to play.</p>
